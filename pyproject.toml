[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learningloop"
version = "0.3.1"
description = "A stateful personal learning assistant built on an Agent Harness and Agent Skills."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1,<26",
    "ddgs>=9.5,<10",
    "fastapi>=0.116,<1",
    "fsrs>=6.3,<7",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "openai>=1.109,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0,<7",
    "react-agent-harness==0.12.1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
observability = [
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.37,<2",
    "opentelemetry-sdk>=1.37,<2",
]
dev = [
    "pip-audit>=2.9,<3",
    "pyright>=1.1.400,<2",
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.1,<2",
    "pytest-cov>=7,<8",
    "respx>=0.22,<1",
    "ruff>=0.12,<1",
]

[project.scripts]
learningloop = "learningloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learningloop = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
